[package]
name = "ctx"
version = "0.2.0"
edition = "2021"
description = "Natural language → optimized AI context window. Tell it what to build, get exactly the files an LLM needs."
authors = ["Aidan Magee <magee@axiom.team>"]
license = "MIT"
repository = "https://github.com/Mageester/context-compiler"
keywords = ["context", "llm", "ai", "code", "cli"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for OpenAI API calls
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# SQLite for persistent index
rusqlite = { version = "0.31", features = ["bundled"] }

# Tree-sitter for code parsing
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-javascript = "0.25"

# ONNX for local embeddings (unused in current MVP — hash-based embedder used instead)
# ort = { version = "2.0.0-rc.12", optional = true }

# Serde for serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File watching
notify = "6"

# Progress bars
indicatif = "0.17"

# Clipboard
arboard = "3"

# Syntax highlighting in output
syntect = "5"

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
anyhow = "1"
thiserror = "1"

# Glob walking
walkdir = "2"
ignore = "0.4"

# UUID for session tracking
uuid = { version = "1", features = ["v4"] }

# Time
chrono = "0.4"

# TOML config parsing
toml = "0.8"

# Colored output
colored = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ctx"
path = "src/main.rs"
