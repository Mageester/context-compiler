<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" rx="12"/>
  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" fill="#f0ede8" font-size="28" font-weight="600">Context Compiler</text>
  <text x="400" y="72" text-anchor="middle" fill="#8a847a" font-size="15">Tell it what to build → get exactly the files your AI needs</text>
  <!-- Step 1 -->
  <rect x="40" y="110" width="200" height="70" rx="8" fill="rgba(34,211,238,.06)" stroke="rgba(34,211,238,.2)" stroke-width="1.5"/>
  <text x="140" y="138" text-anchor="middle" fill="#22d3ee" font-size="15" font-weight="600">💬 Describe your task</text>
  <text x="140" y="162" text-anchor="middle" fill="#c5bfb2" font-size="12">"fix auth race condition"</text>
  <!-- Arrow -->
  <line x1="240" y1="145" x2="290" y2="145" stroke="#22d3ee" stroke-width="2" opacity=".5"/>
  <polygon points="288,140 298,145 288,150" fill="#22d3ee" opacity=".5"/>
  <!-- Step 2 -->
  <rect x="300" y="110" width="200" height="70" rx="8" fill="rgba(212,175,55,.06)" stroke="rgba(212,175,55,.2)" stroke-width="1.5"/>
  <text x="400" y="135" text-anchor="middle" fill="#d4af37" font-size="15" font-weight="600">⚡ Analyze codebase</text>
  <text x="400" y="155" text-anchor="middle" fill="#c5bfb2" font-size="11">847 files · 3 signals</text>
  <text x="400" y="172" text-anchor="middle" fill="#8a847a" font-size="10">semantic + dependency + history</text>
  <!-- Arrow -->
  <line x1="500" y1="145" x2="550" y2="145" stroke="#22d3ee" stroke-width="2" opacity=".5"/>
  <polygon points="548,140 558,145 548,150" fill="#22d3ee" opacity=".5"/>
  <!-- Step 3 -->
  <rect x="560" y="110" width="200" height="70" rx="8" fill="rgba(52,211,153,.06)" stroke="rgba(52,211,153,.2)" stroke-width="1.5"/>
  <text x="660" y="138" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">📋 Get context</text>
  <text x="660" y="162" text-anchor="middle" fill="#c5bfb2" font-size="12">4 files · 4.2K tokens</text>
  <!-- Results table -->
  <rect x="40" y="220" width="720" height="150" rx="8" fill="rgba(0,0,0,.3)" stroke="rgba(255,255,255,.06)"/>
  <text x="60" y="248" fill="#22d3ee" font-size="14" font-weight="600">📊 Results</text>
  <line x1="60" y1="258" x2="740" y2="258" stroke="rgba(255,255,255,.06)"/>
  <rect x="60" y="270" width="340" height="28" rx="4" fill="rgba(52,211,153,.06)" stroke="rgba(52,211,153,.15)"/>
  <text x="74" y="289" fill="#34d399" font-size="13" font-family="'SF Mono',monospace">📄 auth-middleware.ts  ↑1.2K tok 92%</text>
  <rect x="60" y="304" width="340" height="28" rx="4" fill="rgba(52,211,153,.06)" stroke="rgba(52,211,153,.15)"/>
  <text x="74" y="323" fill="#34d399" font-size="13" font-family="'SF Mono',monospace">📄 session-store.ts    ↑0.8K tok 78%</text>
  <rect x="60" y="338" width="340" height="28" rx="4" fill="rgba(212,175,55,.06)" stroke="rgba(212,175,55,.15)"/>
  <text x="74" y="357" fill="#d4af37" font-size="13" font-family="'SF Mono',monospace">📄 types/session.d.ts  ↑0.4K tok 71%</text>
  <rect x="420" y="270" width="320" height="28" rx="4" fill="rgba(34,211,238,.06)" stroke="rgba(34,211,238,.15)"/>
  <text x="434" y="289" fill="#22d3ee" font-size="13" font-family="'SF Mono',monospace">📄 concurrency/lock.ts ↑0.9K tok 65%</text>
  <text x="434" y="330" fill="#8a847a" font-size="13">✅ Copied to clipboard</text>
  <text x="434" y="350" fill="#8a847a" font-size="12">From 847 files · 3.2M tokens</text>
  <text x="434" y="368" fill="#34d399" font-size="12" font-weight="500">→ Paste into any AI agent</text>
</svg>
