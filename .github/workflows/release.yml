name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            arch_label: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch_label: linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            arch_label: macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            arch_label: macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare tarball
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCH_LABEL="${{ matrix.arch_label }}"
          TARBALL="ctx-${TAG}-${ARCH_LABEL}.tar.gz"
          cd "target/${{ matrix.target }}/release"
          tar czf "/tmp/${TARBALL}" ctx
          echo "artifact_name=${TARBALL}" >> "$GITHUB_ENV"
          echo "artifact_path=/tmp/${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctx-${{ github.ref_name }}-${{ matrix.arch_label }}.tar.gz
          path: /tmp/ctx-${{ github.ref_name }}-${{ matrix.arch_label }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: List downloaded artifacts
        run: find /tmp/artifacts -type f -name '*.tar.gz' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            /tmp/artifacts/**/ctx-${{ github.ref_name }}-*.tar.gz
